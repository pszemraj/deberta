name: FlashDeBERTa Imports

on:
  pull_request:
    paths:
      - "src/**"
      - "configs/**"
      - "pyproject.toml"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/flashdeberta-imports.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "configs/**"
      - "pyproject.toml"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/flashdeberta-imports.yml"

# CI covers the CPU regression suite without FlashDeBERTa and a clean resolve
# of the flash extra. GPU-shaped checks run through tools/premerge.sh on real hardware.
jobs:
  cpu-tests:
    name: CPU regression suite without FlashDeBERTa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies without flash extra
        run: python -m pip install -e '.[dev]'
      - name: Run CPU regression suite
        run: python -m pytest tests/ -q

  flash-extra:
    name: flash extra resolves and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flash extra on a clean CPU-only machine
        run: python -m pip install -e '.[flash]'
      - name: Import package and flash dependency
        run: python -c "import deberta, flashdeberta"
