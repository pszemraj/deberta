name: FlashDeBERTa Imports

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "tests/test_flashdeberta_patch.py"
      - ".github/workflows/flashdeberta-imports.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "tests/test_flashdeberta_patch.py"
      - ".github/workflows/flashdeberta-imports.yml"

# CI only covers environment contracts a GPU dev box cannot verify locally:
# importing without triton installed, and a fresh resolve of the flash extra.
# Everything GPU-shaped runs through tools/premerge.sh on real hardware.
jobs:
  no-triton:
    name: no-triton import contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies without flash extra
        run: python -m pip install -e '.[dev]'
      - name: Run no-Triton import regression
        run: python -m pytest tests/test_flashdeberta_patch.py::test_flashdeberta_pack_and_varlen_modules_import_without_triton -q

  flash-extra:
    name: flash extra resolves and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flash extra on a clean CPU-only machine
        run: python -m pip install -e '.[flash]'
      - name: Import package and flash dependency
        run: python -c "import deberta, flashdeberta"
