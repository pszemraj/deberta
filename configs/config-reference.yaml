# DeBERTa RTD training config reference
#
# This file is both the complete config reference and a valid native-DeBERTa training config.
# Copy it, change the dataset/output path, and remove keys you do not intend to override.
#
# FILE CONTRACT
# - Accepted file types: YAML (.yaml/.yml) and JSON (.json).
# - Runtime sections: model, data, train, optim, and logging. Unknown keys fail validation.
# - YAML booleans must be unquoted true/false. Quoted booleans are strings and are rejected.
# - Numeric fields accept YAML numbers or numeric strings. null is accepted only for `| None` types.
# - A config file is fully validated before CLI overrides are applied. A broken file cannot
#   be repaired by a later flag.
#
# CLI AND PRECEDENCE
# - Every leaf below is also a dotted flag: `model.backbone_type` becomes
#   `--model.backbone_type VALUE`.
# - Highest priority: dotted CLI flag > config file > documented omission behavior.
# - Dotted flags cannot express null; use YAML/JSON when a nullable field must be reset.
# - `deberta train CONFIG --dry-run` performs config/output/resume/tokenizer/dataset/collator/model
#   preflight without optimization or checkpoint writes. It may use the network and populate caches.
#
# DEFAULTS
# - `schema default` is the dataclass fallback.
# - `default` is what omission actually does. Backbone recipes state intentional deviations.
# - All keys are optional unless `required` says otherwise. The dataset-source group is conditionally
#   required: configure dataset_name, data_files, or load_from_disk.
#
# RUN OUTPUTS
# - A null checkpoint output dir becomes runs/<project>/<timestamp>_<run-or-config-name>.
# - A null logging output dir uses the resolved checkpoint output dir.
# - The checkpoint dir receives model/data/train/optim/logging JSON snapshots and run_metadata.json.
# - The logging dir receives config_original.yaml and config_resolved.yaml. W&B uploads those configs.

model:
  # [model.backbone_type]
  # type: str
  # schema default: "hf_deberta_v2"
  # default: literal "hf_deberta_v2"
  # required: optional
  # values: "hf_deberta_v2" | "rope"
  # contract: hf_deberta_v2 is the supported native DeBERTa-v2/v3 parity path. rope is an experimental
  #   RoPE/RMSNorm path; every model.rope.* key is experimental and only applies to that value.
  backbone_type: "hf_deberta_v2"

  # [model.from_scratch]
  # type: bool
  # schema default: true
  # default: literal true
  # required: optional
  # values: true | false
  # contract: false requires model.pretrained.discriminator_path. Pretrained RoPE requires repo-native
  #   DebertaRoPE checkpoints, keeps scratch-only model.rope.* values at their defaults, and applies
  #   architecture overrides only through model.rope.pretrained.*. Recommend true for pretraining.
  from_scratch: true

  # [model.embedding_sharing]
  # type: str
  # schema default: "gdes"
  # default: literal "gdes"
  # required: optional
  # values: "none" | "es" | "gdes"
  # contract: gdes is recommended. es shares embeddings directly, requires
  #   train.decoupled_training=false, and requires optim.lr.generator=-1 or equal to optim.lr.base.
  #   none duplicates embeddings and uses more parameters.
  embedding_sharing: "gdes"

  # [model.gradient_checkpointing]
  # type: bool
  # schema default: false
  # default: literal false (feature off)
  # required: optional
  # values: true | false
  # contract: true checkpoints both backbones to reduce activation memory at the cost of recomputation.
  #   Enable only after measuring memory and throughput; it does not replace optimizer-state sharding.
  gradient_checkpointing: false

  tokenizer:
    # [model.tokenizer.name_or_path]
    # type: str
    # schema default: "microsoft/deberta-v3-base"
    # default: literal "microsoft/deberta-v3-base"
    # required: optional
    # values: non-empty Hugging Face tokenizer id or local tokenizer directory
    # contract: pretrained mode requires vocabulary and special-token compatibility with both checkpoint
    #   configs. Scratch mode copies tokenizer vocabulary/special ids into the new model configs.
    name_or_path: "microsoft/deberta-v3-base"

    # [model.tokenizer.allow_vocab_resize]
    # type: bool
    # schema default: false
    # default: literal false (growth forbidden)
    # required: optional
    # values: true | false
    # contract: permits tokenizer growth with inert placeholder tokens when vocab_target or vocab_multiple
    #   demands it. Resizing never shrinks. Pretrained mode cannot grow beyond checkpoint vocab_size.
    #   Keep false unless the vocabulary change is deliberate and checkpoint compatibility is understood.
    allow_vocab_resize: false

    # [model.tokenizer.vocab_target]
    # type: int | None
    # schema default: null
    # default: literal null (no explicit target)
    # required: optional
    # values: null or integer > 0 and >= the loaded tokenizer size
    # contract: growth requires model.tokenizer.allow_vocab_resize=true. In pretrained mode the target
    #   cannot exceed checkpoint vocab_size. It is rounded again by model.tokenizer.vocab_multiple.
    vocab_target: null

    # [model.tokenizer.vocab_multiple]
    # type: int
    # schema default: 1
    # default: literal 1 (no rounding)
    # required: optional
    # values: integer >= 1
    # contract: rounds tokenizer size upward. Any growth requires model.tokenizer.allow_vocab_resize=true;
    #   pretrained mode cannot round beyond checkpoint vocab_size. Use 128 only when vocabulary padding
    #   for hardware efficiency justifies changing the tokenizer.
    vocab_multiple: 1

  hf:
    # [model.hf.model_size]
    # type: str
    # schema default: "base"
    # default: literal "base"
    # required: optional
    # values: "xsmall" | "small" | "base" | "large"
    # contract: scratch preset dimensions (hidden/layers/heads/FFN) are xsmall=384/12/6/1536,
    #   small=768/6/12/3072, base=768/12/12/3072, and large=1024/24/16/4096. Only applies to
    #   model.backbone_type=hf_deberta_v2; a non-default value with rope is ignored with a warning.
    model_size: "base"

    # [model.hf.attention_kernel]
    # type: str
    # schema default: "dynamic"
    # default: literal "dynamic"
    # required: optional
    # values: "dynamic" | "cached_bmm" | "stable"
    # aliases: default->dynamic, cache/cached->cached_bmm, safe/compile_safe->stable
    # contract: selects native eager disentangled-bias math. dynamic uses einsum; cached_bmm and stable
    #   use the explicit batched-matmul path. It does not enable FlashDeBERTa. Only applies to
    #   hf_deberta_v2; a non-default value with rope is ignored with a warning.
    attention_kernel: "dynamic"

    # [model.hf.attention_impl]
    # type: str
    # schema default: "eager"
    # default: literal "eager"
    # required: optional
    # values: "eager" | "flash"
    # contract: eager is recommended for portability. flash requires hf_deberta_v2, installation with
    #   `pip install -e '.[flash]'`, CUDA with bf16 support, and effective hidden/attention dropout of exactly
    #   0.0. Set both model.dropout fields explicitly to 0.0; null may preserve nonzero checkpoint/preset
    #   dropout. Build-time incompatibilities fail; unsupported per-call masks use eager fallbacks.
    attention_impl: "eager"

    flash:
      # [model.hf.flash.force_varlen]
      # type: bool
      # schema default: false
      # default: literal false
      # required: optional
      # values: true | false
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: only used when model.hf.attention_impl=flash. true forces right-padded batches onto
      #   variable-length kernels and overrides varlen_min_seq_len. Keep false outside benchmarks/debugging.
      force_varlen: false

      # [model.hf.flash.varlen_min_seq_len]
      # type: int | None
      # schema default: null
      # default: null uses the capability table (fixed below 2048, varlen at 2048+ in shipped policy)
      # required: optional
      # values: null or integer > 0
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: a positive value replaces the padded fixed/varlen threshold. force_varlen=true takes
      #   precedence. It does not affect packed document-block routes.
      varlen_min_seq_len: null

      # [model.hf.flash.docblock_bias_seq_len]
      # type: int | None
      # schema default: null
      # default: null uses capability policy: dense at measured 1024/2048/4096 on sm_120, ragged elsewhere
      # required: optional
      # values: null, 0, or integer > 0
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: 0 forces ragged docblock. A positive value forces dense docblock_bias only at that exact
      #   length on any GPU and bypasses table max-length/max-batch safeguards. Dense bias saves a quadratic
      #   (B,H,S,S) tensor for backward and can OOM immediately; clear this after controlled tuning.
      docblock_bias_seq_len: null

      # [model.hf.flash.local_bias_seq_len]
      # type: int | None
      # schema default: null
      # default: null uses capability policy (shipped local-bias row is sm_120-only)
      # required: optional
      # values: null, 0, or integer > 0
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: applies only to plain unpadded training batches. 0 disables; positive permits only the exact
      #   length. Off-table GPUs must set this together with local_bias_max_batch_size; either zero disables.
      #   Independent of docblock_bias_seq_len.
      local_bias_seq_len: null

      # [model.hf.flash.local_bias_max_batch_size]
      # type: int | None
      # schema default: null
      # default: null uses capability policy
      # required: optional
      # values: null, 0, or integer > 0
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: caps dense local-bias use. Off-table GPUs must set this together with local_bias_seq_len;
      #   either zero disables. Dense bias is hardware-sensitive and stores quadratic attention state.
      local_bias_max_batch_size: null

      # [model.hf.flash.eager_dense_max_seq_len]
      # type: int
      # schema default: 0
      # default: literal 0 (debug fallback disabled)
      # required: optional
      # values: integer >= 0
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: only used with flash. A positive threshold allows selected short dense calls to use eager
      #   attention for comparisons. Leave 0 for training; enabling it changes routing/performance.
      eager_dense_max_seq_len: 0

      # [model.hf.flash.kernel_overrides_path]
      # type: str | None
      # schema default: null
      # default: null uses the shipped JSON table
      # required: optional
      # values: null or path to a JSON object
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: JSON may contain seq_buckets and kernels arrays plus a route_policies object mapping
      #   padding/docblock/local_bias to arrays. Bucket rows require name and accept min/max_seq_len plus
      #   min/max_density/max_density_exclusive. Route rows require seq_bucket/choice and accept
      #   compute_capability, min/max_seq_len, and max_batch_size. Kernel rows require route, kind, seq_bucket,
      #   block_m, block_n, num_stages, and num_warps; optional predicates include capability, head_dim,
      #   batch/query/key/head ranges, causal, disentangled, has_mask, dtype, and att_span_min. Override
      #   route/kernel rows beat equally specific shipped rows; new buckets match first and same-name buckets
      #   replace shipped ones. Missing/malformed files fail on first route lookup.
      kernel_overrides_path: null

      # [model.hf.flash.debug_stats]
      # type: bool
      # schema default: false
      # default: literal false (route counters disabled)
      # required: optional
      # values: true | false
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: enables process-local counters for flash routes and eager fallback reasons. Counters are
      #   hard-disabled inside torch.compile graphs, are intended for uncompiled diagnostics/benchmarks rather
      #   than training metrics, and can be read through flashdeberta_stats_snapshot. Recommend false for normal
      #   training and true only while diagnosing routing with train.compile.enabled=false.
      debug_stats: false

      # [model.hf.flash.warn_fallbacks]
      # type: bool
      # schema default: true
      # default: literal true (warn once for each eager-fallback reason)
      # required: optional
      # values: true | false
      # status: experimental; only used when model.hf.attention_impl=flash
      # contract: controls per-process eager-fallback warnings emitted outside torch.compile graphs. Compiled
      #   forwards cannot emit these warnings; host-side batch-preparation warnings remain independent. Keep true
      #   unless a diagnostic or benchmark deliberately needs quiet output, because false can hide throughput loss.
      warn_fallbacks: true

    # [model.hf.max_position_embeddings]
    # type: int | None
    # schema default: null
    # default: null keeps the scratch preset's 512 positions
    # required: optional
    # values: null or integer > 0
    # contract: only valid for hf_deberta_v2 with model.from_scratch=true and must be >=
    #   data.packing.max_seq_length. Set it when scratch training uses sequences longer than 512.
    max_position_embeddings: null

  pretrained:
    # [model.pretrained.discriminator_path]
    # type: str
    # schema default: ""
    # default: literal empty string in scratch mode
    # required: required when model.from_scratch=false
    # values: empty string in scratch mode; otherwise non-empty checkpoint directory or model id
    # contract: supplies discriminator config and weights. Checkpoint family must match backbone_type;
    #   Microsoft DeBERTa v2/v3 checkpoints are invalid for rope.
    discriminator_path: ""

    # [model.pretrained.generator_path]
    # type: str | None
    # schema default: null
    # default: null derives generator config from discriminator; pretrained mode reuses discriminator weights
    # required: optional
    # values: null or non-empty checkpoint directory/model id
    # contract: a separate source makes every model.generator.* override invalid. In scratch mode its config
    #   may seed generator architecture, but weights are still initialized for scratch training.
    generator_path: null

  generator:
    # [model.generator.num_hidden_layers]
    # type: int | None
    # schema default: null
    # default: half discriminator depth for hf_deberta_v2; one-third for rope; minimum 1
    # required: optional
    # values: null or integer > 0
    # contract: only affects a derived generator and must be null when pretrained.generator_path is set.
    num_hidden_layers: null

    # [model.generator.hidden_size]
    # type: int | None
    # schema default: null
    # default: null inherits discriminator hidden size
    # required: optional
    # values: null or integer > 0
    # contract: derived generator only. Must be null with pretrained.generator_path and is invalid in
    #   pretrained mode without a separate generator checkpoint. Resolved width must divide evenly by heads.
    hidden_size: null

    # [model.generator.intermediate_size]
    # type: int | None
    # schema default: null
    # default: null inherits discriminator FFN width
    # required: optional
    # values: null or integer > 0
    # contract: derived generator only. Must be null with pretrained.generator_path and is invalid in
    #   pretrained mode without a separate generator checkpoint.
    intermediate_size: null

    # [model.generator.num_attention_heads]
    # type: int | None
    # schema default: null
    # default: null inherits discriminator head count
    # required: optional
    # values: null or integer > 0
    # contract: derived generator only. Must be null with pretrained.generator_path and is invalid in
    #   pretrained mode without a separate generator checkpoint. Must divide resolved generator hidden size.
    num_attention_heads: null

  rope:
    # All model.rope.* keys are experimental. Scratch keys below are valid only when
    # model.backbone_type=rope and model.from_scratch=true. In pretrained RoPE mode they must remain at
    # their schema defaults; use model.rope.pretrained.* for explicit checkpoint-compatible overrides.

    # [model.rope.hidden_size]
    # type: int
    # schema default: 768
    # default: literal 768
    # required: optional
    # values: integer > 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: must be divisible by model.rope.num_attention_heads. It controls embeddings, residual
    #   width, and attention projection width; changing it prevents loading incompatible checkpoints.
    hidden_size: 768

    # [model.rope.num_hidden_layers]
    # type: int
    # schema default: 12
    # default: literal 12
    # required: optional
    # values: integer > 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: discriminator depth. A derived generator defaults to one-third of this value unless
    #   model.generator.num_hidden_layers is set.
    num_hidden_layers: 12

    # [model.rope.num_attention_heads]
    # type: int
    # schema default: 12
    # default: literal 12
    # required: optional
    # values: integer > 0 that divides model.rope.hidden_size
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: head dimension is hidden_size divided by this value. Keep divisibility exact.
    num_attention_heads: 12

    # [model.rope.intermediate_size]
    # type: int
    # schema default: 3072
    # default: literal 3072 before optional SwiGLU adjustment
    # required: optional
    # values: integer > 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: FFN width. With ffn_type=swiglu and swiglu_adjust_intermediate=true, runtime scales this
    #   to roughly two-thirds and rounds upward to a multiple of 128 to preserve MLP-like parameter count.
    intermediate_size: 3072

    # [model.rope.hidden_act]
    # type: str
    # schema default: "gelu"
    # default: literal "gelu"
    # required: optional
    # values: "gelu" | "gelu_10" | "gelu_accurate" | "gelu_fast" | "gelu_new" | "gelu_python" |
    #   "gelu_pytorch_tanh" | "laplace" | "leaky_relu" | "linear" | "mish" | "prelu" |
    #   "quick_gelu" | "relu" | "relu2" | "relu6" | "sigmoid" | "silu" | "swish" | "tanh"
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: activation registry name used by the FFN. Recommend gelu for BERT/DeBERTa comparison;
    #   changing it changes checkpoint architecture/behavior.
    hidden_act: "gelu"

    # [model.rope.rope_theta]
    # type: float
    # schema default: 10000.0
    # default: literal 10000.0
    # required: optional
    # values: finite number > 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: rotary frequency base. Larger values shift long-range frequencies but do not by themselves
    #   guarantee stable context extension. Recommend 10000 unless reproducing a measured long-context setup.
    rope_theta: 10000.0

    # [model.rope.rotary_pct]
    # type: float
    # schema default: 1.0
    # default: literal 1.0
    # required: optional
    # values: number in (0, 1]
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: fraction of each attention head receiving rotary position encoding. Recommend 1.0; partial
    #   rotary changes architecture and should be used only for a deliberate ablation.
    rotary_pct: 1.0

    # [model.rope.use_absolute_position_embeddings]
    # type: bool
    # schema default: false
    # default: literal false (absolute embedding table absent)
    # required: optional
    # values: true | false
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: true adds learned absolute positions in addition to RoPE. Keep false for the modern RoPE
    #   baseline; the value must match any checkpoint architecture.
    use_absolute_position_embeddings: false

    # [model.rope.max_position_embeddings]
    # type: int | None
    # schema default: null
    # default: null derives the required value from data.packing.max_seq_length
    # required: optional
    # values: null or integer > 0 and >= data.packing.max_seq_length
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: sizes optional learned absolute positions/config context. Set explicitly only when the model
    #   budget must exceed the current training sequence length.
    max_position_embeddings: null

    # [model.rope.type_vocab_size]
    # type: int
    # schema default: 2
    # default: literal 2
    # required: optional
    # values: integer >= 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: 0 disables token-type embeddings; 1 permits only segment id 0; 2 supports BERT-style 0/1
    #   ids. Keep 2 unless the tokenizer/data contract guarantees a smaller vocabulary.
    type_vocab_size: 2

    # [model.rope.norm_arch]
    # type: str
    # schema default: "post"
    # default: literal "post"
    # required: optional
    # values: "post" | "keel"
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: post applies RMSNorm after residual addition. keel enables KEEL residual scaling and makes
    #   keel_alpha_init/keel_alpha_learnable active. Recommend post unless running a KEEL experiment.
    norm_arch: "post"

    # [model.rope.norm_eps]
    # type: float
    # schema default: 1e-6
    # default: literal 1e-6
    # required: optional
    # values: finite number > 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: RMSNorm epsilon. Recommend 1e-6 for bf16 stability; changing it changes checkpoint numerics.
    norm_eps: 1e-6

    # [model.rope.keel_alpha_init]
    # type: float | None
    # schema default: null
    # default: null computes 1/sqrt(2 * num_hidden_layers) when norm_arch=keel
    # required: optional
    # values: null or finite number
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: only used with model.rope.norm_arch=keel. A non-null value with post has no effect and emits
    #   a warning. Leave null for depth-scaled KEEL initialization.
    keel_alpha_init: null

    # [model.rope.keel_alpha_learnable]
    # type: bool
    # schema default: false
    # default: literal false
    # required: optional
    # values: true | false
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: only used with model.rope.norm_arch=keel. true makes both KEEL residual scalars trainable;
    #   true with post has no effect and emits a warning.
    keel_alpha_learnable: false

    # [model.rope.attention_implementation]
    # type: str
    # schema default: "sdpa"
    # default: literal "sdpa"
    # required: optional
    # values: "sdpa" | "eager"
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: sdpa is recommended and is controlled by train.sdpa_kernel. eager uses explicit attention
    #   math for debugging/parity; any non-auto train.sdpa_kernel is invalid with eager.
    attention_implementation: "sdpa"

    # [model.rope.ffn_type]
    # type: str
    # schema default: "mlp"
    # default: literal "mlp"
    # required: optional
    # values: "mlp" | "swiglu"
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: mlp is BERT-style GELU FFN. swiglu enables gated SiLU and activates
    #   model.rope.swiglu_adjust_intermediate. Changing this changes checkpoint architecture.
    ffn_type: "mlp"

    # [model.rope.use_bias]
    # type: bool
    # schema default: false
    # default: literal false
    # required: optional
    # values: true | false
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: adds linear-layer biases. Keep false for the modern baseline; it must match checkpoint shape.
    use_bias: false

    # [model.rope.swiglu_adjust_intermediate]
    # type: bool
    # schema default: true
    # default: literal true
    # required: optional
    # values: true | false
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: only used with model.rope.ffn_type=swiglu. true scales intermediate_size to approximately
    #   two-thirds and rounds to 128; false uses the configured width directly. A non-default value with mlp
    #   has no effect and emits a warning.
    swiglu_adjust_intermediate: true

    # [model.rope.initializer_range]
    # type: float
    # schema default: 0.02
    # default: literal 0.02
    # required: optional
    # values: finite number >= 0
    # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=true
    # contract: standard deviation for scratch weight initialization. Recommend 0.02; zero creates
    #   degenerate zero-initialized weight matrices and is accepted only for controlled tests.
    initializer_range: 0.02

    pretrained:
      # These overrides are experimental and valid only for backbone_type=rope with from_scratch=false.
      # Each non-null value replaces the same field loaded from the checkpoint config and must remain
      # compatible with the saved weights. In scratch mode, any non-null pretrained override is invalid.

      # [model.rope.pretrained.max_position_embeddings]
      # type: int | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or integer > 0 and >= data.packing.max_seq_length
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes the config position budget; learned absolute-position weights must still be shape
      #   compatible when the checkpoint uses them.
      max_position_embeddings: null

      # [model.rope.pretrained.rope_theta]
      # type: float | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or finite number > 0
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes rotary frequencies without changing saved tensor shapes. Use only for an intentional
      #   checkpoint adaptation; it changes inference/training behavior immediately.
      rope_theta: null

      # [model.rope.pretrained.rotary_pct]
      # type: float | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or number in (0, 1]
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes rotary dimension and can make checkpoint behavior incompatible even when tensor
      #   shapes load. Match the checkpoint unless deliberately adapting it.
      rotary_pct: null

      # [model.rope.pretrained.use_absolute_position_embeddings]
      # type: bool | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null | true | false
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: must match whether the checkpoint contains/uses absolute-position embeddings; changing it
      #   can create missing or unexpected weights.
      use_absolute_position_embeddings: null

      # [model.rope.pretrained.type_vocab_size]
      # type: int | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or integer >= 0
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes token-type embedding shape/presence. It must match checkpoint weights and input ids.
      type_vocab_size: null

      # [model.rope.pretrained.norm_arch]
      # type: str | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null | "post" | "keel"
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: switching post/keel changes residual architecture and parameter expectations. Match the
      #   checkpoint; keel_alpha_* applies only when the resolved value is keel.
      norm_arch: null

      # [model.rope.pretrained.norm_eps]
      # type: float | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or finite number > 0
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes normalization numerics without changing tensor shapes. Recommend preserving the
      #   checkpoint value unless correcting a known compatibility issue.
      norm_eps: null

      # [model.rope.pretrained.keel_alpha_init]
      # type: float | None
      # schema default: null
      # default: null preserves checkpoint config or uses depth-derived KEEL initialization
      # required: optional
      # values: null or finite number
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: only meaningful when resolved norm_arch=keel. It changes residual scaling immediately.
      keel_alpha_init: null

      # [model.rope.pretrained.keel_alpha_learnable]
      # type: bool | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null | true | false
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: only meaningful when resolved norm_arch=keel and must match checkpoint parameter layout.
      keel_alpha_learnable: null

      # [model.rope.pretrained.ffn_type]
      # type: str | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null | "mlp" | "swiglu"
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes FFN architecture and saved tensor shapes. Match the checkpoint; this is not a
      #   safe post-hoc performance toggle.
      ffn_type: null

      # [model.rope.pretrained.use_bias]
      # type: bool | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null | true | false
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: changes linear parameter layout and must match checkpoint weights.
      use_bias: null

      # [model.rope.pretrained.initializer_range]
      # type: float | None
      # schema default: null
      # default: null preserves checkpoint config
      # required: optional
      # values: null or finite number >= 0
      # status: experimental; only valid with model.backbone_type=rope and model.from_scratch=false
      # contract: only affects newly initialized/missing parameters; loaded weights are unchanged. Preserve
      #   the checkpoint value unless partial initialization is intentional.
      initializer_range: null

  dropout:
    # [model.dropout.hidden_prob]
    # type: float | None
    # schema default: 0.0
    # default: literal 0.0 (hidden dropout off); null preserves the backbone/checkpoint value
    # required: optional
    # values: null or number in [0, 1]
    # contract: applies to both backbones. model.hf.attention_impl=flash requires effective dropout 0.0, so
    #   set this explicitly to 0.0; null can leave native scratch/pretrained dropout nonzero. Recommend 0.0
    #   for parity/throughput; 1.0 drops all eligible activations and is useful only for pathological tests.
    hidden_prob: 0.0

    # [model.dropout.attention_probs_prob]
    # type: float | None
    # schema default: 0.0
    # default: literal 0.0 (attention-probability dropout off); null preserves the backbone/checkpoint value
    # required: optional
    # values: null or number in [0, 1]
    # contract: applies to both backbones. model.hf.attention_impl=flash requires effective dropout 0.0, so
    #   set this explicitly to 0.0; null can leave native scratch/pretrained dropout nonzero. Positive values
    #   add regularization but make the configured flash implementation fail at build time.
    attention_probs_prob: 0.0

data:
  source:
    # Exactly one source mode must be usable: dataset_name (optionally with data_files), data_files alone,
    # or load_from_disk. load_from_disk is mutually exclusive with every other source selector.

    # [data.source.dataset_name]
    # type: str | None
    # schema default: null
    # default: literal null
    # required: one of dataset_name, data_files, or load_from_disk is required
    # values: null or non-empty Hugging Face dataset id/builder name
    # contract: may be combined with data.source.dataset_config_name and data.source.data_files. With
    #   data_files it selects the builder used to read those files. Cannot be combined with load_from_disk.
    dataset_name: "HuggingFaceFW/fineweb-edu"

    # [data.source.dataset_config_name]
    # type: str | None
    # schema default: null
    # default: literal null
    # required: optional
    # values: null or non-empty dataset subset/config name
    # contract: requires data.source.dataset_name and cannot be combined with load_from_disk. Leave null
    #   when the dataset has no named subset.
    dataset_config_name: "default"

    # [data.source.data_files]
    # type: str | None
    # schema default: null
    # default: literal null
    # required: one of dataset_name, data_files, or load_from_disk is required
    # values: null or comma-separated local paths/URLs containing at least one non-empty item
    # contract: with dataset_name, files are passed to that dataset builder. Without dataset_name, the
    #   Hugging Face `text` builder is used. Cannot be combined with load_from_disk.
    data_files: null

    # [data.source.load_from_disk]
    # type: str | None
    # schema default: null
    # default: literal null
    # required: one of dataset_name, data_files, or load_from_disk is required
    # values: null or non-empty directory created by Hugging Face Dataset.save_to_disk
    # contract: requires data.source.streaming=false and cannot be combined with dataset_name,
    #   dataset_config_name, or data_files. DatasetDict inputs select data.source.train_split.
    load_from_disk: null

    # [data.source.train_split]
    # type: str
    # schema default: "train"
    # default: literal "train"
    # required: optional
    # values: non-empty split name present in the selected source
    # contract: passed as `split` for load_dataset. For load_from_disk DatasetDict, it selects the mapping
    #   entry; a single saved Dataset ignores split selection.
    train_split: "train"

    # [data.source.text_column_name]
    # type: str
    # schema default: "text"
    # default: literal "text"
    # required: optional
    # values: non-empty column name present in every consumed example
    # contract: raw text is read from this column before tokenization. A wrong name fails when examples are
    #   consumed, including during dry-run preflight.
    text_column_name: "text"

    # [data.source.streaming]
    # type: bool
    # schema default: true
    # default: literal true
    # required: optional
    # values: true | false
    # contract: true uses Hugging Face IterableDataset streaming and is recommended for large remote corpora.
    #   load_from_disk requires false. With false, shuffle_buffer_size must be 0 or 1.
    streaming: true

    # [data.source.shuffle_buffer_size]
    # type: int
    # schema default: 10000
    # default: literal 10000
    # required: optional
    # values: integer >= 0 when streaming=true; only 0 or 1 when streaming=false
    # contract: streaming uses this reservoir size; 0 disables shuffling. Non-streaming treats 0 as off and
    #   1 as on. Larger buffers improve mixing but use more host memory and delay startup.
    shuffle_buffer_size: 10000

    # [data.source.retry_attempts]
    # type: int
    # schema default: 3
    # default: literal 3
    # required: optional
    # values: integer >= 1
    # contract: total attempts for transient dataset loading and streaming I/O failures. A resumed stream
    #   is replayed to its last yielded example with the same epoch seed and shard, avoiding duplicates.
    #   Schema, authentication, and other non-transient errors fail immediately.
    retry_attempts: 3

    # [data.source.retry_backoff_seconds]
    # type: float
    # schema default: 1.0
    # default: literal 1.0
    # required: optional
    # values: finite number >= 0
    # contract: initial delay before retrying a transient dataset failure. Delay doubles after each failure
    #   and is capped at 60 seconds. Use 0 only for local tests; remote streams should keep a positive delay.
    retry_backoff_seconds: 1.0

  packing:
    # [data.packing.enabled]
    # type: bool
    # schema default: true
    # default: literal true
    # required: optional
    # values: true | false
    # contract: packs multiple documents into fixed-length samples and is recommended for throughput.
    #   data.packing.block_cross_document_attention=true requires this field to be true.
    enabled: true

    # [data.packing.max_seq_length]
    # type: int
    # schema default: 512
    # default: literal 512
    # required: optional
    # values: integer >= 8 and within both model backbones' max-position budget
    # contract: controls packed block/training context length. Native scratch DeBERTa defaults to 512
    #   positions, so longer values require model.hf.max_position_embeddings. With document blocking above
    #   2048, non-segment-aware routes may build O(S^2) masks and emit a memory warning.
    max_seq_length: 512

    # [data.packing.block_cross_document_attention]
    # type: bool
    # schema default: false
    # default: literal false
    # required: optional
    # values: true | false
    # contract: true prevents packed documents from attending to one another and requires packing.enabled.
    #   With rope, train.sdpa_kernel=flash is invalid because strict flash SDPA cannot consume doc-block
    #   masks; use auto, mem_efficient, or math. Native FlashDeBERTa uses dense/ragged doc-block routes.
    block_cross_document_attention: false

train:
  # [train.seed]
  # type: int
  # schema default: 42
  # default: literal 42
  # required: optional
  # values: any integer
  # contract: base seed for model initialization, masking, and data-order setup. Exact replay still depends
  #   on distributed topology, worker count, data source behavior, and non-deterministic kernels.
  seed: 42

  # [train.max_steps]
  # type: int
  # schema default: 10000
  # default: literal 10000
  # required: optional
  # values: integer >= 1
  # contract: optimizer-step budget and the only duration control; there is no num_epochs alternative.
  #   Gradient accumulation changes micro-batches per step, not this count.
  max_steps: 10000

  # [train.per_device_train_batch_size]
  # type: int
  # schema default: 4
  # default: literal 4
  # required: optional
  # values: integer >= 1
  # contract: micro-batch examples per process. Global examples per optimizer step equal this value times
  #   train.gradient_accumulation_steps times distributed process count. Tune against VRAM first.
  per_device_train_batch_size: 4

  # [train.gradient_accumulation_steps]
  # type: int
  # schema default: 1
  # default: literal 1
  # required: optional
  # values: integer >= 1
  # contract: micro-batches per optimizer step. Resume metadata records this value; changing it across resume
  #   can alter data-progress interpretation. token_weighted_gradient_accumulation controls loss weighting.
  gradient_accumulation_steps: 1

  # [train.token_weighted_gradient_accumulation]
  # type: bool
  # schema default: true
  # default: literal true
  # required: optional
  # values: true | false
  # contract: true weights accumulated losses by active tokens rather than treating variable-density
  #   micro-batches equally. Recommend true for packed, padded, or ragged training.
  token_weighted_gradient_accumulation: true

  # [train.mixed_precision]
  # type: str
  # schema default: "bf16"
  # default: literal "bf16"
  # required: optional
  # values: "bf16" | "no"
  # aliases: bfloat16/true/1/yes/y/on->bf16; none/false/0/off/n->no (quote boolean-like YAML strings)
  # contract: bf16 is recommended on supported modern GPUs and fails preflight if bf16 sanity checks fail.
  #   no uses full precision and generally costs more memory/throughput. fp16 is not supported.
  mixed_precision: "bf16"

  # [train.tf32]
  # type: bool
  # schema default: true
  # default: literal true
  # required: optional
  # values: true | false
  # contract: enables TensorFloat-32 matmul policy where CUDA hardware supports it; otherwise has no effect.
  #   Recommend true on Ampere-or-newer GPUs unless strict fp32 matmul parity is required.
  tf32: true

  # [train.sdpa_kernel]
  # type: str
  # schema default: "auto"
  # default: literal "auto"
  # required: optional
  # values: "auto" | "flash" | "mem_efficient" | "math"
  # aliases: mem/mem-efficient/efficient->mem_efficient; flashattention/flash_attention->flash
  # contract: only affects model.backbone_type=rope with model.rope.attention_implementation=sdpa. A
  #   non-auto value with hf_deberta_v2 is ignored with warning; with rope eager it is invalid. flash is
  #   invalid when packing.block_cross_document_attention=true. Recommend auto unless isolating a kernel.
  sdpa_kernel: "auto"

  # [train.decoupled_training]
  # type: bool
  # schema default: true
  # default: literal true
  # required: optional
  # values: true | false
  # contract: true performs separate generator and discriminator optimizer phases and is recommended with
  #   model.embedding_sharing=gdes/none. It is invalid with embedding_sharing=es because discriminator-phase
  #   gradients on shared embeddings would be dropped. false uses a joint forward/backward update.
  decoupled_training: true

  dataloader:
    # [train.dataloader.num_workers]
    # type: int
    # schema default: 2
    # default: literal 2
    # required: optional
    # values: integer >= 0
    # contract: workers per process. Use 0 for deterministic debugging and clearer exceptions; increase only
    #   after measuring throughput. Streaming sources are sharded across ranks and workers.
    num_workers: 2

    # [train.dataloader.pin_memory]
    # type: bool
    # schema default: true
    # default: literal true
    # required: optional
    # values: true | false
    # contract: pins host batches for asynchronous CUDA transfer. Recommend true for CUDA; false may reduce
    #   host-memory pressure for CPU-only runs.
    pin_memory: true

  compile:
    # All train.compile.* keys are experimental. Compile failures are hard errors; there is no silent eager
    # fallback. Validate the selected scope against the exact attention/data route before long runs.

    # [train.compile.enabled]
    # type: bool
    # schema default: false
    # default: literal false (torch.compile off)
    # required: optional
    # values: true | false
    # status: experimental
    # contract: true compiles selected inner backbone paths, not the full RTD wrapper. mode, scope, and
    #   backend only apply when true; non-default values while false are ignored with warnings.
    enabled: false

    # [train.compile.mode]
    # type: str
    # schema default: "default"
    # default: literal "default"
    # required: optional
    # values: "default" | "reduce-overhead" | "max-autotune" | "max-autotune-no-cudagraphs"
    # aliases: reduce_overhead->reduce-overhead; max_autotune->max-autotune;
    #   max_autotune_no_cudagraphs->max-autotune-no-cudagraphs
    # status: experimental
    # contract: only used when compile.enabled=true. default is recommended initially. reduce-overhead may
    #   use more memory/cudagraphs; max-autotune increases compile time; no-cudagraphs avoids capture issues.
    mode: "default"

    # [train.compile.scope]
    # type: str
    # schema default: "auto"
    # default: literal "auto"
    # required: optional
    # values: "auto" | "backbones" | "encoder" | "gen_encoder" | "disc_encoder" | "ffn" |
    #   "gen_ffn" | "disc_ffn"
    # aliases: backbone/both/full->backbones; encoders->encoder; ffns->ffn;
    #   generator_encoder->gen_encoder; discriminator_encoder->disc_encoder;
    #   generator_ffn->gen_ffn; discriminator_ffn->disc_ffn
    # status: experimental
    # contract: auto chooses a route-compatible scope. backbones compiles both full backbones; encoder/ffn
    #   target that component in both models; gen_* and disc_* target only the named model. Start with auto.
    scope: "auto"

    # [train.compile.backend]
    # type: str
    # schema default: "inductor"
    # default: literal "inductor"
    # required: optional
    # values: "inductor" | "aot_eager"
    # aliases: aot-eager->aot_eager
    # status: experimental
    # contract: only used when compile.enabled=true. inductor is the optimizing production backend;
    #   aot_eager is a debugging backend and is not expected to improve throughput.
    backend: "inductor"

  objective:
    # [train.objective.mlm_probability]
    # type: float
    # schema default: 0.15
    # default: literal 0.15
    # required: optional
    # values: finite number in (0, 1)
    # contract: fraction of active, eligible tokens selected for MLM/RTD corruption. Recommend 0.15 for
    #   parity unless a measured corruption-rate experiment requires otherwise.
    mlm_probability: 0.15

    # [train.objective.mask_token_prob]
    # type: float
    # schema default: 1.0
    # default: when omitted, 1.0 for hf_deberta_v2 and 0.8 for rope
    # required: optional
    # values: finite number >= 0; sum with random_token_prob must be <= 1
    # contract: conditional probability that a selected token becomes [MASK]. The remaining probability
    #   after mask+random keeps the original token. Explicit values are never replaced by the backbone
    #   profile. This file uses the native parity value 1.0.
    mask_token_prob: 1.0

    # [train.objective.random_token_prob]
    # type: float
    # schema default: 0.0
    # default: when omitted, 0.0 for hf_deberta_v2 and 0.1 for rope
    # required: optional
    # values: finite number >= 0; sum with mask_token_prob must be <= 1
    # contract: conditional probability that a selected token becomes a sampled random token. Special/control
    #   ids are excluded. Explicit values are never replaced by the backbone profile. This file uses the
    #   native parity value 0.0.
    random_token_prob: 0.0

    # [train.objective.mlm_max_ngram]
    # type: int
    # schema default: 1
    # default: literal 1
    # required: optional
    # values: integer >= 1
    # contract: maximum DeBERTa windowed masking span. 1 is windowed unigram masking, not BERT iid token
    #   masking; values >1 enable whole-word n-gram grouping. Recommend 1 for parity.
    mlm_max_ngram: 1

    # [train.objective.sampling_temperature]
    # type: float
    # schema default: 1.0
    # default: literal 1.0
    # required: optional
    # values: finite number > 0
    # contract: softmax temperature for generator-sampled discriminator replacements. Lower is sharper;
    #   higher is more random. Recommend 1.0 unless replacement entropy is being measured.
    sampling_temperature: 1.0

    # [train.objective.gen_loss_weight]
    # type: float
    # schema default: 1.0
    # default: literal 1.0
    # required: optional
    # values: finite number >= 0; at least one objective weight must be > 0
    # contract: multiplies generator MLM loss. 0 disables generator optimization in decoupled mode. Recommend
    #   1.0; negative/non-finite values are nonsensical and should be rejected before training.
    gen_loss_weight: 1.0

    # [train.objective.disc_loss_weight]
    # type: float
    # schema default: 10.0
    # default: when omitted, 10.0 for hf_deberta_v2 and 50.0 for rope
    # required: optional
    # values: finite number >= 0; at least one objective weight must be > 0
    # contract: multiplies discriminator RTD loss. 0 disables discriminator optimization in decoupled mode.
    #   Explicit values are never replaced by the backbone profile. This file uses the native parity value
    #   10.0.
    disc_loss_weight: 10.0

  checkpoint:
    # [train.checkpoint.output_dir]
    # type: str | None
    # schema default: null
    # default: runs/<project>/<timestamp>_<run-or-config-name> when null
    # required: optional
    # values: null or non-empty directory path
    # contract: checkpoint/run-metadata destination. Existing non-empty dirs fail unless overwrite is true or
    #   resume_from_checkpoint is set. logging.output_dir defaults to this resolved path.
    output_dir: "runs/config-reference"

    # [train.checkpoint.overwrite_output_dir]
    # type: bool
    # schema default: false
    # default: literal false
    # required: optional
    # values: true | false
    # contract: true permits destructive reuse/removal of an existing output directory. It is mutually
    #   exclusive with resume_from_checkpoint because overwrite could delete the resume source. Keep false.
    overwrite_output_dir: false

    # [train.checkpoint.save_steps]
    # type: int
    # schema default: 1000
    # default: literal 1000
    # required: optional
    # values: integer >= 0
    # contract: periodic checkpoint interval in optimizer steps. 0 disables periodic saves, but a final
    #   checkpoint is still attempted after progress or a single-process crash.
    save_steps: 1000

    # [train.checkpoint.save_total_limit]
    # type: int
    # schema default: 3
    # default: literal 3
    # required: optional
    # values: integer >= 0
    # contract: retains newest checkpoint-* directories after committed saves. 0 disables rotation and can
    #   consume unbounded disk. Deletion is irreversible; choose a limit consistent with recovery needs.
    save_total_limit: 3

    # [train.checkpoint.resume_from_checkpoint]
    # type: str | None
    # schema default: null
    # default: literal null (fresh run)
    # required: optional
    # values: null | "auto" | existing committed checkpoint directory
    # contract: mutually exclusive with overwrite_output_dir=true. auto scans output_dir for the newest
    #   resumable checkpoint and skips incomplete newer saves; explicit paths must have .complete, valid
    #   data_state.json progress, and non-empty model weights. Missing/incomplete sources fail fast.
    resume_from_checkpoint: null

    # [train.checkpoint.resume_data_strategy]
    # type: str
    # schema default: "auto"
    # default: literal "auto"
    # required: optional
    # values: "auto" | "replay" | "restart_epoch"
    # contract: replay reconsumes saved micro-batch progress from epoch zero for closest data alignment;
    #   restart_epoch starts a new epoch offset at global_step; auto replays only when consumed micro-batches
    #   are <= resume_replay_max_micro_batches. Recommend auto for bounded startup cost.
    resume_data_strategy: "auto"

    # [train.checkpoint.resume_replay_max_micro_batches]
    # type: int
    # schema default: 10000
    # default: literal 10000
    # required: optional
    # values: integer >= 0
    # contract: threshold used only by resume_data_strategy=auto. Progress above it selects restart_epoch;
    #   replay ignores this cap. Larger values improve alignment but can make resume startup very slow.
    resume_replay_max_micro_batches: 10000

    # [train.checkpoint.export_hf_final]
    # type: bool
    # schema default: true
    # default: literal true
    # required: optional
    # values: true | false
    # contract: after successful training, attempts discriminator export from the final committed checkpoint
    #   into <output_dir>/final_hf. Export failure is logged but does not change training exit status. Disable
    #   for benchmarks/probes to avoid extra I/O and model construction.
    export_hf_final: true

optim:
  lr:
    # [optim.lr.base]
    # type: float
    # schema default: 0.0005
    # default: literal 0.0005
    # required: optional
    # values: finite number > 0
    # contract: base AdamW learning rate and inheritance source for generator/discriminator overrides. The
    #   recommended value depends on global token batch/model size; 5e-4 is the project starting point.
    base: 0.0005

    # [optim.lr.generator]
    # type: float
    # schema default: -1.0
    # default: -1.0 inherits optim.lr.base
    # required: optional
    # values: -1.0 or finite number > 0
    # contract: generator-specific override. With model.embedding_sharing=es it must inherit or equal
    #   optim.lr.base because the shared embedding parameters cannot use conflicting rates.
    generator: -1.0

    # [optim.lr.discriminator]
    # type: float
    # schema default: -1.0
    # default: -1.0 inherits optim.lr.base
    # required: optional
    # values: -1.0 or finite number > 0
    # contract: discriminator-specific override. Leave -1.0 unless the two RTD phases have a measured need
    #   for different learning rates.
    discriminator: -1.0

  adam:
    # [optim.adam.beta1]
    # type: float
    # schema default: 0.9
    # default: literal 0.9
    # required: optional
    # values: finite number in [0, 1)
    # contract: Adam first-moment decay. Recommend 0.9 unless reproducing a known optimizer recipe.
    beta1: 0.9

    # [optim.adam.beta2]
    # type: float
    # schema default: 0.999
    # default: literal 0.999
    # required: optional
    # values: finite number in [0, 1)
    # contract: Adam second-moment decay. Recommend 0.999; lower values adapt variance faster but can make
    #   large-scale pretraining noisier.
    beta2: 0.999

    # [optim.adam.epsilon]
    # type: float
    # schema default: 1e-6
    # default: when omitted, 1e-6 for hf_deberta_v2 and 1e-8 for rope
    # required: optional
    # values: finite number > 0
    # contract: Adam denominator epsilon. Explicit values are never replaced by the backbone profile. At
    #   optimizer construction, bf16 raises values below 1e-6 to 1e-6 for stability. This file uses the
    #   native parity value 1e-6.
    epsilon: 1e-6

  scheduler:
    # [optim.scheduler.type]
    # type: str
    # schema default: "linear"
    # default: literal "linear"
    # required: optional
    # values: "linear" | "cosine" | "cosine_with_restarts" | "polynomial" | "constant" |
    #   "constant_with_warmup"
    # contract: Transformers scheduler family. linear/cosine/polynomial decay after warmup;
    #   cosine_with_restarts adds cycles; constant ignores warmup_steps; constant_with_warmup warms then
    #   holds. Recommend linear for parity unless another schedule is measured.
    type: "linear"

    # [optim.scheduler.warmup_steps]
    # type: int
    # schema default: 10000
    # default: when omitted, 10000 for hf_deberta_v2 and 1000 for rope
    # required: optional
    # values: integer >= 0
    # contract: optimizer steps spent warming the learning rate. Ignored by scheduler.type=constant. This
    #   file uses native parity value 10000; explicit values are never replaced by the backbone profile.
    #   Ensure warmup is meaningfully smaller than train.max_steps.
    warmup_steps: 10000

  # [optim.weight_decay]
  # type: float
  # schema default: 0.01
  # default: literal 0.01
  # required: optional
  # values: finite number >= 0
  # contract: AdamW weight decay for decay-eligible parameter groups. Recommend 0.01 as a starting point;
  #   0 disables weight decay.
  weight_decay: 0.01

  # [optim.max_grad_norm]
  # type: float
  # schema default: 1.0
  # default: literal 1.0
  # required: optional
  # values: finite number >= 0
  # contract: global gradient clipping norm. 0 disables clipping. Recommend 1.0 until gradient-norm metrics
  #   show that clipping is either excessive or unnecessary.
  max_grad_norm: 1.0

logging:
  # [logging.project_name]
  # type: str
  # schema default: "deberta-train"
  # default: literal "deberta-train"
  # required: optional
  # values: non-empty string
  # contract: W&B project name and namespace used by automatic checkpoint path generation. Avoid slashes or
  #   path-like values; runtime sanitizes it for local directory names.
  project_name: "deberta-train"

  # [logging.run_name]
  # type: str | None
  # schema default: null
  # default: null derives a tracker/output label from config path or generic "run"
  # required: optional
  # values: null or string
  # contract: explicit tracker run name and auto-output naming hint. It does not replace project_name.
  #   Use stable descriptive names when comparing runs; timestamps still distinguish auto output paths.
  run_name: "config-reference"

  # [logging.output_dir]
  # type: str | None
  # schema default: null
  # default: null uses resolved train.checkpoint.output_dir
  # required: optional
  # values: null or non-empty directory path
  # contract: stores original/resolved YAML snapshots and local tracker files. Setting a different path
  #   separates logs from checkpoints; keep both locations together when preserving a run.
  output_dir: "runs/config-reference"

  # [logging.logging_steps]
  # type: int
  # schema default: 50
  # default: literal 50
  # required: optional
  # values: integer >= 0
  # contract: optimizer-step interval for periodic scalar logging. 0 disables periodic scalar rows but does
  #   not disable crash/final metadata. Smaller values add synchronization/I/O overhead.
  logging_steps: 50

  # [logging.backend]
  # type: str
  # schema default: "none"
  # default: literal "none" (no local tracker)
  # required: optional
  # values: "none" | "tensorboard"
  # contract: used only when logging.wandb.enabled=false. tensorboard requires installation with
  #   `pip install -e '.[tensorboard]'`. When W&B is enabled, effective backend is W&B and this is ignored.
  backend: "none"

  wandb:
    # [logging.wandb.enabled]
    # type: bool
    # schema default: false
    # default: literal false (W&B off)
    # required: optional
    # values: true | false
    # contract: true requires `pip install -e '.[wandb]'` plus valid W&B authentication/environment. It
    #   takes precedence over logging.backend and uploads config snapshots. Keep false for offline/local runs.
    enabled: false

    # [logging.wandb.watch]
    # type: str
    # schema default: "gradients"
    # default: literal "gradients", but inactive while logging.wandb.enabled=false
    # required: optional
    # values: "none" | "gradients" | "parameters" | "all"
    # aliases: off/disabled/false/0->none; grad/gradient->gradients;
    #   weights/params/param->parameters
    # contract: only applies when wandb.enabled=true. none disables model watching; gradients/parameters/all
    #   select tensors sent at watch_log_freq. Non-default values while W&B is disabled are ignored with a
    #   warning. Watching can add substantial communication and memory overhead.
    watch: "gradients"

    # [logging.wandb.watch_log_freq]
    # type: int
    # schema default: 100
    # default: literal 100, but inactive while logging.wandb.enabled=false or watch=none
    # required: optional
    # values: integer >= 1
    # contract: sampling interval passed directly to wandb.watch. With gradient accumulation and decoupled
    #   phases it is not guaranteed to correspond one-to-one with optimizer steps. Non-default values while
    #   W&B is disabled are ignored with a warning. Increase it to reduce tracking overhead.
    watch_log_freq: 100

  debug:
    # [logging.debug.metrics]
    # type: bool
    # schema default: false
    # default: literal false (extra diagnostics off)
    # required: optional
    # values: true | false
    # status: diagnostic
    # contract: records additional training diagnostics/artifacts for investigation. It can add computation,
    #   synchronization, storage, and noisy logs; keep false for throughput benchmarks.
    metrics: false
