# Tiny CPU smoke config.
# Usage:
#   deberta train configs/tiny_cpu_smoke.yaml

model:
  backbone_type: rope
  from_scratch: true
  embedding_sharing: gdes
  tokenizer:
    name_or_path: microsoft/deberta-v3-base
  generator:
    num_hidden_layers: 1
  rope:
    hidden_size: 64
    num_hidden_layers: 2
    num_attention_heads: 4
    intermediate_size: 128
    type_vocab_size: 0
    norm_arch: post

data:
  source:
    data_files: ./data/tiny.txt
    streaming: true
    shuffle_buffer_size: 0
  packing:
    enabled: true
    block_cross_document_attention: false
    max_seq_length: 32

train:
  max_steps: 10
  per_device_train_batch_size: 2
  # Quoted: YAML would otherwise parse a bare `no` as boolean false.
  mixed_precision: "no"
  tf32: false
  dataloader:
    num_workers: 0
    pin_memory: false
  compile:
    enabled: false
  checkpoint:
    output_dir: null
    save_steps: 0
    save_total_limit: 1
    export_hf_final: false

optim:
  lr:
    base: 1.0e-3
  scheduler:
    type: constant
    warmup_steps: 0

logging:
  project_name: deberta-smoke
  logging_steps: 1
  wandb:
    enabled: false
