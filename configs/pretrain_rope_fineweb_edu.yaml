# Experimental RoPE/RMSNorm/SwiGLU RTD pretraining example.
# Usage:
#   deberta train configs/pretrain_rope_fineweb_edu.yaml

model:
  backbone_type: rope
  from_scratch: true
  embedding_sharing: gdes
  tokenizer:
    name_or_path: microsoft/deberta-v3-base
  rope:
    norm_arch: post
    ffn_type: swiglu
    attention_implementation: sdpa

data:
  source:
    dataset_name: HuggingFaceFW/fineweb-edu
    dataset_config_name: default
    train_split: train
    text_column_name: text
    streaming: true
    shuffle_buffer_size: 10000
  packing:
    enabled: true
    max_seq_length: 512
    block_cross_document_attention: false

train:
  max_steps: 10000
  # Measured at 15.8 GiB peak reserved VRAM on an RTX 5090 with an effective batch of 40.
  per_device_train_batch_size: 40
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  dataloader:
    num_workers: 2
    pin_memory: true
  compile:
    enabled: false
  checkpoint:
    output_dir: null
    save_steps: 1000
    save_total_limit: 3
    export_hf_final: true

optim:
  lr:
    base: 5.0e-4
  scheduler:
    type: linear
    warmup_steps: 1000

logging:
  project_name: deberta-rope
  logging_steps: 25
  wandb:
    enabled: false
